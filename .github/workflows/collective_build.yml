name: collective_build.yml

on:
  workflow_call:
    inputs:
      publish_to_test_feed:
        required: false
        type: boolean
        default: true
        description: 'true: lint + build + test + publish to test feed. false: lint + build + test only, no publish'
      os:
        required: false
        type: string
        default: 'all'
        description: 'Which OS(es) to build/test on: "win" (windows-latest), "lin" (ubuntu-latest) or "all" (both)'
      workdir:
        required: false
        type: string
        default: '.'
      prebuild_command:
        required: false
        type: string
      dotnet_version:
        required: false
        type: string
        default: '8.0.x'
        description: 'Version of .NET SDK to use, e.g. 6.0.x, 8.0.x'
      strict_analyzers:
        required: false
        type: boolean
        default: true
    secrets:
      badge_service_api_key:
        required: true
      source_nuget_feed_url:
        required: false
        description: 'Optional NuGet feed URL used while restoring and building the project.'
      source_nuget_feed_api_key:
        required: false
      target_feed_api_key:
        required: false
      env_vars:
        required: false
        description: >
          JSON object mapping the environment variable name to set to its value, e.g.
          '{"MY_API_KEY": "<resolved-value>"}'. In the
          caller, resolve each value from its own secrets context, wrapping it with the toJSON()
          function so special characters stay valid JSON.

jobs:
  code_quality:
    name: Check Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Super-Linter
        uses: super-linter/super-linter@v8.7.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATE_CSHARP: true
          IGNORE_GITIGNORED_FILES: true
          FILTER_REGEX_INCLUDE: "${{ inputs.workdir }}/.*"

  build_windows:
    name: Build on windows-latest
    if: ${{ inputs.os == 'win' || inputs.os == 'all' }}
    runs-on: windows-latest
    steps:
      - name: Build and test
        uses: FrendsPlatform/FrendsTasks/.github/actions/dotnet-build-test@workflows-update
        with:
          workdir: ${{ inputs.workdir }}
          prebuild_command: ${{ inputs.prebuild_command }}
          dotnet_version: ${{ inputs.dotnet_version }}
          strict_analyzers: ${{ inputs.strict_analyzers }}
          env_vars: ${{ secrets.env_vars }}
          badge_service_api_key: ${{ secrets.badge_service_api_key }}
          source_nuget_feed_url: ${{ secrets.source_nuget_feed_url }}
          source_nuget_feed_api_key: ${{ secrets.source_nuget_feed_api_key }}

  build_linux:
    name: Build on ubuntu-latest
    if: ${{ inputs.os == 'lin' || inputs.os == 'all' }}
    runs-on: ubuntu-latest
    steps:
      # An alias is needed so that docker-compose works with the dash in between.
      - name: Create alias for docker-compose
        shell: bash
        run: |
          sudo touch /usr/bin/docker-compose
          sudo echo 'docker compose --compatibility "$@"' | sudo tee /usr/bin/docker-compose
          sudo chmod +x /usr/bin/docker-compose

      - name: Build and test
        uses: FrendsPlatform/FrendsTasks/.github/actions/dotnet-build-test@workflows-update
        with:
          workdir: ${{ inputs.workdir }}
          prebuild_command: ${{ inputs.prebuild_command }}
          dotnet_version: ${{ inputs.dotnet_version }}
          strict_analyzers: ${{ inputs.strict_analyzers }}
          env_vars: ${{ secrets.env_vars }}
          badge_service_api_key: ${{ secrets.badge_service_api_key }}
          source_nuget_feed_url: ${{ secrets.source_nuget_feed_url }}
          source_nuget_feed_api_key: ${{ secrets.source_nuget_feed_api_key }}

  publish:
    name: Publish NuGet package(s)
    needs: [code_quality, build_windows, build_linux]
    if: >-
      ${{
        always() &&
        inputs.publish_to_test_feed &&
        needs.code_quality.result == 'success' &&
        (
          (inputs.os == 'win' && needs.build_windows.result == 'success') ||
          (inputs.os == 'lin' && needs.build_linux.result == 'success') ||
          (inputs.os == 'all' && needs.build_windows.result == 'success' && needs.build_linux.result == 'success')
        )
      }}
    runs-on: ubuntu-latest
    env:
      TARGET_FEED_URL_TEST: https://pkgs.dev.azure.com/frends-platform/frends-tasks/_packaging/test/nuget/v3/index.json
      TARGET_FEED_URL_MAIN: https://pkgs.dev.azure.com/frends-platform/frends-tasks/_packaging/main/nuget/v3/index.json
    steps:
      - name: Validate target NuGet feed configuration
        shell: pwsh
        env:
          TARGET_FEED_URL: ${{ env.TARGET_FEED_URL_TEST }}
        run: |
          if ([string]::IsNullOrEmpty($env:TARGET_FEED_API_KEY)) {
            throw "target_feed_api_key is required when publish_to_test_feed is true."
          }

      - name: Setup .NET SDK with target NuGet feed
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          source-url: ${{ env.TARGET_FEED_URL_TEST }}
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.target_feed_api_key }}

      - name: Download NuGet package(s)
        uses: actions/download-artifact@v5.0.0
        with:
          pattern: nuget-packages-*
          path: packages
          merge-multiple: true

      - name: Push NuGet package(s)
        shell: pwsh
        env:
          TARGET_FEED_URL: ${{ env.TARGET_FEED_URL_TEST }}
          TARGET_FEED_API_KEY: ${{ secrets.target_feed_api_key }}
        run: |
          $packages = Get-ChildItem -Path packages -Filter *.nupkg -Recurse
          if ($packages.Count -eq 0) {
            throw "No NuGet packages were downloaded for publishing."
          }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key $env:TARGET_FEED_API_KEY `
              --source $env:TARGET_FEED_URL `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to publish $($package.FullName)."
            }
          }
