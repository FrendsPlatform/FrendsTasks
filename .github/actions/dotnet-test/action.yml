name: 'Frends dotnet test'
description: 'Runs tests against a previously built Official Frends Task (build artifact), checks coverage and reports the badge.'

inputs:
  workdir:
    required: false
    default: '.'
    description: 'Working directory containing the .NET task solution.'
  build_artifact_name:
    required: true
    description: 'Name of the artifact containing the bin/obj output of the build job.'
  build_workspace:
    required: true
    description: 'github.workspace of the build job, used to relocate Coverlet source mappings to this runner.'
  pretest_command:
    required: false
    description: 'Optional PowerShell command to run before testing the project (e.g. starting test containers).'
  env_var_names:
    required: false
    description: 'Comma/semicolon/whitespace separated names of secrets to export as environment variables, e.g. FOO,BAR.'
  env_vars:
    required: false
    description: >
      JSON object of all available secrets (the caller passes the toJSON of the secrets context). Only the secrets named
      in env_var_names are exported; each value is masked in the logs and written to GITHUB_ENV.
  badge_service_api_key:
    required: true
    description: 'API key used to publish the code coverage badge.'

runs:
  using: composite
  steps:
    - name: Download build output
      uses: actions/download-artifact@v8.0.1
      with:
        name: ${{ inputs.build_artifact_name }}
        path: ${{ inputs.workdir }}

    - if: ${{ inputs.env_var_names != '' || inputs.env_vars != '' }}
      name: Set dynamic environment variables
      shell: pwsh
      env:
        ENV_VARS_JSON: ${{ inputs.env_vars }}
        ENV_VAR_NAMES: ${{ inputs.env_var_names }}
      run: |
        $names = @($env:ENV_VAR_NAMES -split '[,;\s]+' | Where-Object { $_ })
        if ($names.Count -eq 0) {
          throw "env_vars was provided but env_var_names is empty. List the secret names to export in env_var_names."
        }
        if ([string]::IsNullOrEmpty($env:ENV_VARS_JSON)) {
          throw "env_var_names was provided but env_vars is empty. Pass the toJSON of the secrets context as env_vars."
        }
        $all = $env:ENV_VARS_JSON | ConvertFrom-Json -AsHashtable
        foreach ($name in $names) {
          if ($name -notmatch '^[A-Za-z_][A-Za-z0-9_]*$') {
            throw "Invalid environment variable name '$name'."
          }
          $value = $all[$name]
          if ([string]::IsNullOrEmpty($value)) {
            throw "Secret '$name' is missing or empty."
          }
          # Masks are applied per line, because the runner cannot mask multi-line values as a whole.
          foreach ($line in ($value -split "\r?\n")) {
            if ($line) { Write-Output "::add-mask::$line" }
          }
          $delimiter = "EOF_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_ENV -Value "$name<<$delimiter`n$value`n$delimiter"
        }
    # An alias is needed so that docker-compose works with the dash in between.
    - if: ${{ runner.os == 'Linux' }}
      name: Create alias for docker-compose
      shell: bash
      run: |
        sudo touch /usr/bin/docker-compose
        echo 'docker compose --compatibility "$@"' | sudo tee /usr/bin/docker-compose
        sudo chmod +x /usr/bin/docker-compose

    - if: ${{ inputs.pretest_command != '' }}
      name: Run pretest command
      shell: pwsh
      working-directory: ${{ inputs.workdir }}
      run: ${{ inputs.pretest_command }}

    # The build may come from a different OS, so restore regenerates obj/ with paths valid on this runner.
    - name: Restore
      shell: pwsh
      working-directory: ${{ inputs.workdir }}
      run: dotnet restore

    # Coverlet maps PDB source paths using CoverletSourceRootsMapping files written at build time.
    # They contain the build runner's workspace path, so point them to this runner's checkout.
    - name: Relocate coverage source mappings
      shell: pwsh
      working-directory: ${{ inputs.workdir }}
      env:
        BUILD_WORKSPACE: ${{ inputs.build_workspace }}
      run: |
        $buildRoot = $env:BUILD_WORKSPACE.Replace('\', '/').TrimEnd('/') + '/'
        $localRoot = $env:GITHUB_WORKSPACE.Replace('\', '/').TrimEnd('/') + '/'
        Get-ChildItem -Recurse -File -Filter 'CoverletSourceRootsMapping*' | ForEach-Object {
          # Line format: <project>|<source roots>=<PDB path>; only the left side is relocated.
          $lines = Get-Content $_.FullName | Where-Object { $_.Contains('=') } | ForEach-Object {
            $left, $right = $_ -split '=', 2
            $left.Replace('\', '/').Replace($buildRoot, $localRoot) + '=' + $right
          }
          Set-Content -Path $_.FullName -Value $lines -Encoding Unicode
        }

    - name: Test
      shell: pwsh
      working-directory: ${{ inputs.workdir }}
      run: |
        $settingsFile = ".runtestsettings"
        if (Test-Path $settingsFile) {
          Write-Host "Using $settingsFile found in workspace."
          dotnet test --no-build --settings $settingsFile --collect:"XPlat Code Coverage"
        } else {
          Write-Host "No $settingsFile file found. Running with default settings."
          dotnet test --no-build --collect:"XPlat Code Coverage"
        }

    - id: code_coverage
      name: Check code coverage
      shell: pwsh
      working-directory: ${{ inputs.workdir }}
      run: |
        $file = Get-ChildItem -Path . -Include 'coverage.cobertura.xml' -Recurse
        $lineRate = [double](Select-Xml -XPath '//coverage/@line-rate' $file).Node.Value
        $lineRatePct = [Math]::Round($lineRate * 100)
        if ($lineRatePct -lt 80)
        {
          "## Test coverage failed (${{ runner.os }}) :x:" >> $env:GITHUB_STEP_SUMMARY
          "**Line coverage:** $lineRatePct% | **Required:** 80%" >> $env:GITHUB_STEP_SUMMARY
          exit 1
        }
        else
        {
          "## Test coverage passed (${{ runner.os }}) :white_check_mark:" >> $env:GITHUB_STEP_SUMMARY
          "**Line coverage:** $lineRatePct%" >> $env:GITHUB_STEP_SUMMARY
          "coverage=$lineRatePct" >> $env:GITHUB_OUTPUT
        }

    - name: Save coverage report
      shell: pwsh
      run: |
        $badgeKey = "${{ github.repository }}|${{ github.ref_name }}"
        if ("${{ inputs.workdir }}" -ne ".")
        {
          $badgeKey = "${{ github.repository }}/${{ inputs.workdir }}|${{ github.ref_name }}"
        }
        $json = @{
          key = $badgeKey
          displayName = "Coverage"
          value = "${{ steps.code_coverage.outputs.coverage }}%"
        } | ConvertTo-Json -Compress
        Invoke-WebRequest `
            -Method POST `
            -ContentType "application/json" `
            -Headers @{ "x-api-key" = "${{ inputs.badge_service_api_key }}" } `
            -Body $json `
            https://app-github-custom-badges.azurewebsites.net/Badge
