name: 'Frends dotnet test'
description: 'Runs tests against a previously built Official Frends Task (build artifact), checks coverage and reports the badge.'

inputs:
  workdir:
    required: false
    default: '.'
    description: 'Working directory containing the .NET task solution.'
  build_artifact_name:
    required: true
    description: 'Name of the artifact containing the bin/obj output of the build job.'
  build_workspace:
    required: true
    description: 'github.workspace of the build job, used to relocate Coverlet source mappings to this runner.'
  pretest_command:
    required: false
    description: 'Optional PowerShell command to run before testing the project (e.g. starting test containers).'
  env_var_name_1:
    required: false
    description: 'Name of environment variable 1 to set for the tests.'
  env_var_value_1:
    required: false
    description: 'Value of environment variable 1 (resolve secrets in the caller workflow).'
  env_var_name_2:
    required: false
    description: 'Name of environment variable 2 to set for the tests.'
  env_var_value_2:
    required: false
    description: 'Value of environment variable 2 (resolve secrets in the caller workflow).'
  env_var_name_3:
    required: false
    description: 'Name of environment variable 3 to set for the tests.'
  env_var_value_3:
    required: false
    description: 'Value of environment variable 3 (resolve secrets in the caller workflow).'
  env_var_name_4:
    required: false
    description: 'Name of environment variable 4 to set for the tests.'
  env_var_value_4:
    required: false
    description: 'Value of environment variable 4 (resolve secrets in the caller workflow).'
  env_var_name_5:
    required: false
    description: 'Name of environment variable 5 to set for the tests.'
  env_var_value_5:
    required: false
    description: 'Value of environment variable 5 (resolve secrets in the caller workflow).'
  env_var_name_6:
    required: false
    description: 'Name of environment variable 6 to set for the tests.'
  env_var_value_6:
    required: false
    description: 'Value of environment variable 6 (resolve secrets in the caller workflow).'
  env_var_name_7:
    required: false
    description: 'Name of environment variable 7 to set for the tests.'
  env_var_value_7:
    required: false
    description: 'Value of environment variable 7 (resolve secrets in the caller workflow).'
  env_var_name_8:
    required: false
    description: 'Name of environment variable 8 to set for the tests.'
  env_var_value_8:
    required: false
    description: 'Value of environment variable 8 (resolve secrets in the caller workflow).'
  env_var_name_9:
    required: false
    description: 'Name of environment variable 9 to set for the tests.'
  env_var_value_9:
    required: false
    description: 'Value of environment variable 9 (resolve secrets in the caller workflow).'
  env_var_name_10:
    required: false
    description: 'Name of environment variable 10 to set for the tests.'
  env_var_value_10:
    required: false
    description: 'Value of environment variable 10 (resolve secrets in the caller workflow).'
  env_var_name_11:
    required: false
    description: 'Name of environment variable 11 to set for the tests.'
  env_var_value_11:
    required: false
    description: 'Value of environment variable 11 (resolve secrets in the caller workflow).'
  env_var_name_12:
    required: false
    description: 'Name of environment variable 12 to set for the tests.'
  env_var_value_12:
    required: false
    description: 'Value of environment variable 12 (resolve secrets in the caller workflow).'
  env_var_name_13:
    required: false
    description: 'Name of environment variable 13 to set for the tests.'
  env_var_value_13:
    required: false
    description: 'Value of environment variable 13 (resolve secrets in the caller workflow).'
  env_var_name_14:
    required: false
    description: 'Name of environment variable 14 to set for the tests.'
  env_var_value_14:
    required: false
    description: 'Value of environment variable 14 (resolve secrets in the caller workflow).'
  env_var_name_15:
    required: false
    description: 'Name of environment variable 15 to set for the tests.'
  env_var_value_15:
    required: false
    description: 'Value of environment variable 15 (resolve secrets in the caller workflow).'
  badge_service_api_key:
    required: true
    description: 'API key used to publish the code coverage badge.'

runs:
  using: composite
  steps:
    - name: Download build output
      uses: actions/download-artifact@v8.0.1
      with:
        name: ${{ inputs.build_artifact_name }}
        path: ${{ inputs.workdir }}

    - name: Set dynamic environment variables
      shell: pwsh
      env:
        ENV_NAME_1: ${{ inputs.env_var_name_1 }}
        ENV_VALUE_1: ${{ inputs.env_var_value_1 }}
        ENV_NAME_2: ${{ inputs.env_var_name_2 }}
        ENV_VALUE_2: ${{ inputs.env_var_value_2 }}
        ENV_NAME_3: ${{ inputs.env_var_name_3 }}
        ENV_VALUE_3: ${{ inputs.env_var_value_3 }}
        ENV_NAME_4: ${{ inputs.env_var_name_4 }}
        ENV_VALUE_4: ${{ inputs.env_var_value_4 }}
        ENV_NAME_5: ${{ inputs.env_var_name_5 }}
        ENV_VALUE_5: ${{ inputs.env_var_value_5 }}
        ENV_NAME_6: ${{ inputs.env_var_name_6 }}
        ENV_VALUE_6: ${{ inputs.env_var_value_6 }}
        ENV_NAME_7: ${{ inputs.env_var_name_7 }}
        ENV_VALUE_7: ${{ inputs.env_var_value_7 }}
        ENV_NAME_8: ${{ inputs.env_var_name_8 }}
        ENV_VALUE_8: ${{ inputs.env_var_value_8 }}
        ENV_NAME_9: ${{ inputs.env_var_name_9 }}
        ENV_VALUE_9: ${{ inputs.env_var_value_9 }}
        ENV_NAME_10: ${{ inputs.env_var_name_10 }}
        ENV_VALUE_10: ${{ inputs.env_var_value_10 }}
        ENV_NAME_11: ${{ inputs.env_var_name_11 }}
        ENV_VALUE_11: ${{ inputs.env_var_value_11 }}
        ENV_NAME_12: ${{ inputs.env_var_name_12 }}
        ENV_VALUE_12: ${{ inputs.env_var_value_12 }}
        ENV_NAME_13: ${{ inputs.env_var_name_13 }}
        ENV_VALUE_13: ${{ inputs.env_var_value_13 }}
        ENV_NAME_14: ${{ inputs.env_var_name_14 }}
        ENV_VALUE_14: ${{ inputs.env_var_value_14 }}
        ENV_NAME_15: ${{ inputs.env_var_name_15 }}
        ENV_VALUE_15: ${{ inputs.env_var_value_15 }}
      run: |
        foreach ($i in 1..15) {
          $envName = [Environment]::GetEnvironmentVariable("ENV_NAME_$i")
          if ([string]::IsNullOrEmpty($envName)) { continue }
          $value = [Environment]::GetEnvironmentVariable("ENV_VALUE_$i")
          if ([string]::IsNullOrEmpty($value)) {
            Write-Error "env_var_value_$i for '$envName' is empty."
            exit 1
          }
          Write-Output "::add-mask::$value"
          $delimiter = "EOF_" + [guid]::NewGuid().ToString('N')
          Add-Content -Path $env:GITHUB_ENV -Value "$envName<<$delimiter`n$value`n$delimiter"
        }

    # An alias is needed so that docker-compose works with the dash in between.
    - if: ${{ runner.os == 'Linux' }}
      name: Create alias for docker-compose
      shell: bash
      run: |
        sudo touch /usr/bin/docker-compose
        echo 'docker compose --compatibility "$@"' | sudo tee /usr/bin/docker-compose
        sudo chmod +x /usr/bin/docker-compose

    - if: ${{ inputs.pretest_command != '' }}
      name: Run pretest command
      shell: pwsh
      working-directory: ${{ inputs.workdir }}
      run: ${{ inputs.pretest_command }}

    # The build may come from a different OS, so restore regenerates obj/ with paths valid on this runner.
    - name: Restore
      shell: pwsh
      working-directory: ${{ inputs.workdir }}
      run: dotnet restore

    # Coverlet maps PDB source paths using CoverletSourceRootsMapping files written at build time.
    # They contain the build runner's workspace path, so point them to this runner's checkout.
    - name: Relocate coverage source mappings
      shell: pwsh
      working-directory: ${{ inputs.workdir }}
      env:
        BUILD_WORKSPACE: ${{ inputs.build_workspace }}
      run: |
        $buildRoot = $env:BUILD_WORKSPACE.Replace('\', '/').TrimEnd('/') + '/'
        $localRoot = $env:GITHUB_WORKSPACE.Replace('\', '/').TrimEnd('/') + '/'
        Get-ChildItem -Recurse -File -Filter 'CoverletSourceRootsMapping*' | ForEach-Object {
          # Line format: <project>|<source roots>=<PDB path>; only the left side is relocated.
          $lines = Get-Content $_.FullName | Where-Object { $_.Contains('=') } | ForEach-Object {
            $left, $right = $_ -split '=', 2
            $left.Replace('\', '/').Replace($buildRoot, $localRoot) + '=' + $right
          }
          Set-Content -Path $_.FullName -Value $lines -Encoding Unicode
        }

    - name: Test
      shell: pwsh
      working-directory: ${{ inputs.workdir }}
      run: |
        $settingsFile = ".runtestsettings"
        if (Test-Path $settingsFile) {
          Write-Host "Using $settingsFile found in workspace."
          dotnet test --no-build --settings $settingsFile --collect:"XPlat Code Coverage"
        } else {
          Write-Host "No $settingsFile file found. Running with default settings."
          dotnet test --no-build --collect:"XPlat Code Coverage"
        }

    - id: code_coverage
      name: Check code coverage
      shell: pwsh
      working-directory: ${{ inputs.workdir }}
      run: |
        $file = Get-ChildItem -Path . -Include 'coverage.cobertura.xml' -Recurse
        $lineRate = [double](Select-Xml -XPath '//coverage/@line-rate' $file).Node.Value
        $lineRatePct = [Math]::Round($lineRate * 100)
        if ($lineRatePct -lt 80)
        {
          "## Test coverage failed (${{ runner.os }}) :x:" >> $env:GITHUB_STEP_SUMMARY
          "**Line coverage:** $lineRatePct% | **Required:** 80%" >> $env:GITHUB_STEP_SUMMARY
          exit 1
        }
        else
        {
          "## Test coverage passed (${{ runner.os }}) :white_check_mark:" >> $env:GITHUB_STEP_SUMMARY
          "**Line coverage:** $lineRatePct%" >> $env:GITHUB_STEP_SUMMARY
          "coverage=$lineRatePct" >> $env:GITHUB_OUTPUT
        }

    - name: Save coverage report
      shell: pwsh
      run: |
        $badgeKey = "${{ github.repository }}|${{ github.ref_name }}"
        if ("${{ inputs.workdir }}" -ne ".")
        {
          $badgeKey = "${{ github.repository }}/${{ inputs.workdir }}|${{ github.ref_name }}"
        }
        $json = @{
          key = $badgeKey
          displayName = "Coverage"
          value = "${{ steps.code_coverage.outputs.coverage }}%"
        } | ConvertTo-Json -Compress
        Invoke-WebRequest `
            -Method POST `
            -ContentType "application/json" `
            -Headers @{ "x-api-key" = "${{ inputs.badge_service_api_key }}" } `
            -Body $json `
            https://app-github-custom-badges.azurewebsites.net/Badge
