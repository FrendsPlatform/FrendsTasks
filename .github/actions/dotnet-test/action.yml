name: 'Frends dotnet test'
description: 'Runs tests against a previously built Official Frends Task (build artifact), checks coverage and reports the badge.'

inputs:
  workdir:
    required: false
    default: '.'
    description: 'Working directory containing the .NET task solution.'
  build_artifact_name:
    required: true
    description: 'Name of the artifact containing the bin/obj output of the build job.'
  pretest_command:
    required: false
    description: 'Optional PowerShell command to run before testing the project (e.g. starting test containers).'
  env_vars:
    required: false
    description: >
      JSON object mapping the environment variable name to set to its value, e.g.
      '{"MY_KEY":"<resolved-value>"}'. Resolve secret values in the caller workflow (wrapping
      each with the toJSON() function so special characters stay valid JSON).
  badge_service_api_key:
    required: true
    description: 'API key used to publish the code coverage badge.'

runs:
  using: composite
  steps:
    - name: Download build output
      uses: actions/download-artifact@v8.0.1
      with:
        name: ${{ inputs.build_artifact_name }}
        path: ${{ inputs.workdir }}

    - if: ${{ inputs.env_vars != '' }}
      name: Set dynamic environment variables
      shell: pwsh
      env:
        ENV_VARS_MAPPING: ${{ inputs.env_vars }}
      run: |
        $mapping = $env:ENV_VARS_MAPPING | ConvertFrom-Json
        foreach ($prop in $mapping.PSObject.Properties) {
          $envName = $prop.Name
          $value = $prop.Value
          if ([string]::IsNullOrEmpty($value)) {
            Write-Error "env_vars entry '$envName' has an empty value."
            exit 1
          }
          Write-Output "::add-mask::$value"
          Add-Content -Path $env:GITHUB_ENV -Value "$envName=$value"
        }

    # An alias is needed so that docker-compose works with the dash in between.
    - if: ${{ runner.os == 'Linux' }}
      name: Create alias for docker-compose
      shell: bash
      run: |
        sudo touch /usr/bin/docker-compose
        echo 'docker compose --compatibility "$@"' | sudo tee /usr/bin/docker-compose
        sudo chmod +x /usr/bin/docker-compose

    - if: ${{ inputs.pretest_command != '' }}
      name: Run pretest command
      shell: pwsh
      working-directory: ${{ inputs.workdir }}
      run: ${{ inputs.pretest_command }}

    # The build may come from a different OS, so restore regenerates obj/ with paths valid on this runner.
    - name: Restore
      shell: pwsh
      working-directory: ${{ inputs.workdir }}
      run: dotnet restore

    - name: Test
      shell: pwsh
      working-directory: ${{ inputs.workdir }}
      run: |
        $settingsFile = ".runtestsettings"
        if (Test-Path $settingsFile) {
          Write-Host "Using $settingsFile found in workspace."
          dotnet test --no-build --settings $settingsFile --collect:"XPlat Code Coverage"
        } else {
          Write-Host "No $settingsFile file found. Running with default settings."
          dotnet test --no-build --collect:"XPlat Code Coverage"
        }

    - id: code_coverage
      name: Check code coverage
      shell: pwsh
      working-directory: ${{ inputs.workdir }}
      run: |
        $file = Get-ChildItem -Path . -Include 'coverage.cobertura.xml' -Recurse
        $lineRate = [double](Select-Xml -XPath '//coverage/@line-rate' $file).Node.Value
        $lineRatePct = [Math]::Round($lineRate * 100)
        if ($lineRatePct -lt 80)
        {
          "## Test coverage failed (${{ runner.os }}) :x:" >> $env:GITHUB_STEP_SUMMARY
          "**Line coverage:** $lineRatePct% | **Required:** 80%" >> $env:GITHUB_STEP_SUMMARY
          exit 1
        }
        else
        {
          "## Test coverage passed (${{ runner.os }}) :white_check_mark:" >> $env:GITHUB_STEP_SUMMARY
          "**Line coverage:** $lineRatePct%" >> $env:GITHUB_STEP_SUMMARY
          "coverage=$lineRatePct" >> $env:GITHUB_OUTPUT
        }

    - name: Save coverage report
      shell: pwsh
      run: |
        $badgeKey = "${{ github.repository }}|${{ github.ref_name }}"
        if ("${{ inputs.workdir }}" -ne ".")
        {
          $badgeKey = "${{ github.repository }}/${{ inputs.workdir }}|${{ github.ref_name }}"
        }
        $json = @{
          key = $badgeKey
          displayName = "Coverage"
          value = "${{ steps.code_coverage.outputs.coverage }}%"
        } | ConvertTo-Json -Compress
        Invoke-WebRequest `
            -Method POST `
            -ContentType "application/json" `
            -Headers @{ "x-api-key" = "${{ inputs.badge_service_api_key }}" } `
            -Body $json `
            https://app-github-custom-badges.azurewebsites.net/Badge
