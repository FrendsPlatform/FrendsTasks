name: 'Frends dotnet setup'
description: 'Shared .NET SDK / NuGet feed setup for Official Frends Tasks pipeline jobs.'

inputs:
  dotnet_version:
    required: false
    default: '8.0.x'
    description: 'The .NET SDK version to install and use.'
  feed_url:
    required: false
    description: 'Optional NuGet feed URL to configure for this job.'
  api_key:
    required: false
    description: 'Optional API key used to authenticate to feed_url.'

runs:
  using: composite
  steps:
    - id: check_feed
      name: Check NuGet feed configuration
      shell: pwsh
      env:
        FEED_URL: ${{ inputs.feed_url }}
        FEED_API_KEY: ${{ inputs.api_key }}
      run: |
        if ([string]::IsNullOrEmpty($env:FEED_URL)) {
          if (-not [string]::IsNullOrEmpty($env:FEED_API_KEY)) {
            throw "feed_url must be provided when api_key is specified."
          }
          "configured=false" >> $env:GITHUB_OUTPUT
        }
        else {
          "configured=true" >> $env:GITHUB_OUTPUT
        }

    - if: ${{ steps.check_feed.outputs.configured == 'false' }}
      name: Setup .NET SDK
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: ${{ inputs.dotnet_version }}

    - if: ${{ steps.check_feed.outputs.configured == 'true' }}
      name: Setup .NET SDK with NuGet feed
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: ${{ inputs.dotnet_version }}
        source-url: ${{ inputs.feed_url }}
      env:
        NUGET_AUTH_TOKEN: ${{ inputs.api_key }}
