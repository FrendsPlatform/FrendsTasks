name: Execute_test_on_main
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'Party.Echo.Execute/**'
  workflow_dispatch:

jobs:
  build:
    uses: FrendsPlatform/FrendsTasks/.github/workflows/collective_build.yml@main
    with:
      publish_to_test_feed: false
      os: lin
      workdir: Party.Echo.Execute
      dotnet_version: 8.0.x
      strict_analyzers: true
    secrets:
      badge_service_api_key: ${{ secrets.BADGE_SERVICE_API_KEY }}
      # Example: exposes an env var named "username" set to the value of the "USERNAME" secret.
      # Must go under "secrets:" (not "with:") - only "secrets:" can read the caller's secrets
      # context. toJSON(secrets.X) keeps special characters valid JSON. Add more entries to the
      # object for additional variables.
      env_vars: '{"username": ${{ toJSON(secrets.USERNAME) }}}'
